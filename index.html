<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Widget</title>
<style>
/* ===== Body & Layout ===== */
body {
  margin: 0; height: 100vh;
  display: flex; justify-content: center; align-items: flex-start;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
  padding-top: 30px;
}

/* ===== Container ===== */
.container {
  width: 92vw; max-width: 420px;
}

/* ===== Main Card ===== */
.main-card {
  min-height: 65vh; border-radius: 30px;
  padding: 30px; display: flex; flex-direction: column;
  justify-content: flex-start; align-items: center; text-align: center;
  cursor: pointer;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  transition: transform 0.3s, box-shadow 0.3s;
  position: relative;
}
.main-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}
.main-card.hidden { display: none; }

/* ===== Text Styling ===== */
.city {
  font-size: 36px; font-weight: 700; letter-spacing: 1px;
}
.temp {
  font-size: 100px; margin: 15px 0; font-weight: 600;
}
.description {
  font-size: 22px; text-transform: capitalize; opacity: 0.85;
}
.refresh {
  margin-top: 15px; font-size: 14px; opacity: 0.6;
}

/* ===== Details Card ===== */
.details {
  display: none;
  flex-direction: column;
  gap: 20px;
}
.details.show { display: flex; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

/* ===== Mini Cards ===== */
.mini-card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border-radius: 20px; padding: 20px; text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
  transition: transform 0.3s;
}
.mini-card:hover {
  transform: translateY(-3px);
}
.mini-title {
  font-size: 14px; opacity: 0.7; letter-spacing: 0.5px;
}
.mini-value {
  font-size: 26px; margin-top: 8px; font-weight: 600;
}

/* ===== Back Button ===== */
.back-btn {
  width: 100%; padding: 16px; border: none; border-radius: 18px;
  font-size: 16px; cursor: pointer;
  background: #1f1f1f; color: #fff;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  transition: background 0.3s;
}
.back-btn:hover { background: #333; }

/* ===== Forecast Styles ===== */
.forecast-container {
  margin-top: 20px; display: flex; overflow-x: auto; gap: 14px;
  padding-bottom: 12px; width: 100%;
}
.forecast-card {
  min-width: 70px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px); border-radius: 16px;
  padding: 12px; text-align: center; flex-shrink: 0;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  transition: transform 0.3s;
}
.forecast-card:hover { transform: translateY(-3px); }
.forecast-time { font-size: 12px; opacity: 0.7; }
.forecast-icon { width: 38px; height: 38px; margin-top: 4px; }
.forecast-temp { font-size: 16px; font-weight: 600; margin-top: 5px; }

/* ===== Scrollbar Styling ===== */
.forecast-container::-webkit-scrollbar {
  height: 6px;
}
.forecast-container::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2); border-radius: 3px;
}
</style>
</head>
<body>
<div class="container">

<!-- ===== Main Weather Card ===== -->
<div class="main-card" id="mainCard">
  <div class="city" id="city">Loading...</div>
  <div class="temp" id="temp">--°F</div>
  <div class="description" id="desc">Fetching weather</div>
  <div class="forecast-container" id="forecast"></div>
  <div class="refresh" id="refresh"></div>
</div>

<!-- ===== Details Card with 8 mini-cards ===== -->
<div class="details" id="details">
  <div class="grid">
    <div class="mini-card"><div class="mini-title">Feels Like</div><div class="mini-value" id="feels"></div></div>
    <div class="mini-card"><div class="mini-title">Humidity</div><div class="mini-value" id="humidity"></div></div>
    <div class="mini-card"><div class="mini-title">Wind Speed</div><div class="mini-value" id="wind"></div></div>
    <div class="mini-card"><div class="mini-title">Visibility</div><div class="mini-value" id="visibility"></div></div>
    <div class="mini-card"><div class="mini-title">Pressure</div><div class="mini-value" id="pressure"></div></div>
    <div class="mini-card"><div class="mini-title">UV Index</div><div class="mini-value" id="uv"></div></div>
    <div class="mini-card"><div class="mini-title">Clouds</div><div class="mini-value" id="clouds"></div></div>
    <div class="mini-card"><div class="mini-title">Dew Point</div><div class="mini-value" id="dew"></div></div>
  </div>
  <button class="back-btn" id="backBtn">Back</button>
</div>

</div>

<script>
const API_KEY="32d1a667e7a939e838e64f89f0bb1015";
const mainCard=document.getElementById("mainCard");
const details=document.getElementById("details");
const backBtn=document.getElementById("backBtn");
const forecastContainer=document.getElementById("forecast");

mainCard.addEventListener("click",()=>{
  mainCard.classList.add("hidden");
  details.classList.add("show");
});
backBtn.addEventListener("click",()=>{
  details.classList.remove("show");
  mainCard.classList.remove("hidden");
});

async function getWeather(lat, lon){
  // Current weather
  const url=`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=imperial&appid=${API_KEY}`;
  const res=await fetch(url);
  const data=await res.json();

  document.getElementById("city").textContent=data.name;
  document.getElementById("temp").textContent=Math.round(data.main.temp)+"°F";
  document.getElementById("desc").textContent=data.weather[0].description;

  document.getElementById("feels").textContent=Math.round(data.main.feels_like)+"°F";
  document.getElementById("humidity").textContent=data.main.humidity+"%";
  document.getElementById("wind").textContent=data.wind.speed+" mph";
  document.getElementById("visibility").textContent=(data.visibility/1609).toFixed(1)+" mi";
  document.getElementById("pressure").textContent=data.main.pressure+" hPa";
  document.getElementById("clouds").textContent=data.clouds.all+"%";

  // Dew Point approximation
  const dewPoint = data.main.temp - ((100 - data.main.humidity)/5);
  document.getElementById("dew").textContent=Math.round(dewPoint)+"°F";

  document.getElementById("refresh").textContent="Last updated "+new Date().toLocaleTimeString();

  // Forecast + UV Index
  try {
    const forecastUrl=`https://api.openweathermap.org/data/3.0/onecall?lat=${lat}&lon=${lon}&exclude=minutely,daily,alerts&units=imperial&appid=${API_KEY}`;
    const forecastRes=await fetch(forecastUrl);
    const forecastData=await forecastRes.json();

    // UV Index
    if(forecastData && forecastData.current) document.getElementById("uv").textContent = forecastData.current.uvi;
    else document.getElementById("uv").textContent="-";

    // Hourly forecast
    forecastContainer.innerHTML="";
    forecastData.hourly.slice(0,8).forEach(hour=>{
      const card=document.createElement("div");
      card.className="forecast-card";
      const date = new Date(hour.dt * 1000);
      const hours = date.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const displayHour = ((hours + 11) % 12 + 1) + ampm;
      const iconCode=hour.weather[0].icon;
      card.innerHTML=`<div class="forecast-time">${displayHour}</div>
                      <img class="forecast-icon" src="https://openweathermap.org/img/wn/${iconCode}@2x.png" alt="${hour.weather[0].description}">
                      <div class="forecast-temp">${Math.round(hour.temp)}°F</div>`;
      forecastContainer.appendChild(card);
    });
  } catch(err){ console.error("Forecast fetch failed:", err); }
}

function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      getWeather(pos.coords.latitude,pos.coords.longitude);
    },()=>getWeather(40.7128,-74.0060));
  } else {
    getWeather(40.7128,-74.0060); 
  }
}

getLocation();
setInterval(getLocation,600000);
</script>
</body>
</html>
