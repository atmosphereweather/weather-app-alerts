<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ===== Body & Layout ===== */
body {
  margin: 0; font-family: 'Segoe UI', sans-serif; display: flex;
  background: #0f2027; color: #fff; height: 100vh; overflow: hidden;
}
nav {
  width: 220px; background:#111; display:flex; flex-direction:column; padding-top:20px;
}
nav a {
  color:white; text-decoration:none; padding:15px; font-size:18px;
  transition:0.2s;
}
nav a:hover { background:#222; }
.main-content { flex:1; overflow:auto; padding:20px; }

/* ===== Sections Styling ===== */
.section { display:none; }
.section.active { display:block; }

/* ===== Weather Card ===== */
.main-card {
  min-height: 40vh; border-radius: 20px;
  padding: 20px; display:flex; flex-direction:column; justify-content:center; align-items:center;
  background: rgba(255,255,255,0.05); backdrop-filter: blur(15px);
}
.city{ font-size:32px; font-weight:700; }
.temp{ font-size:72px; margin:10px 0; }
.description{ font-size:20px; opacity:0.8; }
.forecast-container{ display:flex; overflow-x:auto; gap:10px; margin-top:15px; }
.forecast-card{ min-width:60px; background:rgba(255,255,255,0.08); border-radius:12px; padding:8px; text-align:center; }
.forecast-time{ font-size:12px; opacity:0.7; }
.forecast-temp{ font-size:16px; font-weight:600; margin-top:5px; }

/* ===== Alerts Styling ===== */
#alertMap{height:400px; border-radius:12px; margin-bottom:15px;}
.alertCard{ padding:10px; border-radius:10px; margin-bottom:8px; }
.alert-warning{background:red;} .alert-watch{background:orange;} .alert-advisory{background:gold;color:#333;} .alert-daily-summary{background:green;} .alert-wind-advisory{background:#1E90FF;}

/* ===== Videos Styling ===== */
.video-container{ position:relative; width:100%; padding-bottom:56.25%; margin-bottom:20px; }
.video-container iframe{ position:absolute; width:100%; height:100%; border:0; }
</style>
</head>
<body>

<!-- ===== Side Navigation ===== -->
<nav>
  <a href="#" data-section="weather">Weather</a>
  <a href="#" data-section="alerts">Alerts</a>
  <a href="#" data-section="radar">Radar</a>
  <a href="#" data-section="videos">More</a>
</nav>

<!-- ===== Main Content ===== -->
<div class="main-content">

  <!-- Weather Section -->
  <div class="section" id="weather">
    <div class="main-card" id="mainCard">
      <div class="city" id="city">Loading...</div>
      <div class="temp" id="temp">--°F</div>
      <div class="description" id="desc">Fetching weather...</div>
      <div class="forecast-container" id="forecast"></div>
      <div class="refresh" id="refresh"></div>
    </div>
  </div>

  <!-- Alerts Section -->
  <div class="section" id="alerts">
    <h3>Alert Map</h3>
    <div id="alertMap"></div>
    <h3>Active Alerts</h3>
    <div id="alertsList"></div>
    <h3>Past Alerts</h3>
    <div id="historyList"></div>
    <h3>Alert History Chart</h3>
    <canvas id="historyChart" height="100"></canvas>
  </div>

  <!-- Radar Section -->
  <div class="section" id="radar">
    <div style="position:relative;width:100%;padding-bottom:90vh;">
      <iframe src="https://embed.ventusky.com/?p=39;-76;2&l=temperature-2m&w=0EAAtDW2A"
        style="position:absolute;left:0;top:0;width:100%;height:100%;border:0;" loading="lazy"></iframe>
    </div>
  </div>

  <!-- Videos Section -->
  <div class="section" id="videos">
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/lqgtk4ozgsg" allowfullscreen></iframe>
    </div>
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/_5TiTfuvotc" allowfullscreen></iframe>
    </div>
  </div>

</div>

<!-- ===== OneSignal Push Notifications ===== -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "bd818f5a-6267-4efe-b0d1-7c5f5329402e",
    safari_web_id: "web.onesignal.auto.195e7e66-9dea-4e11-b56c-b4a654da5ab7",
    notifyButton: { enable:true },
  });
});
</script>

<!-- ===== JavaScript for Navigation & Weather (simplified) ===== -->
<script>
const sections = document.querySelectorAll(".section");
document.querySelectorAll("nav a").forEach(a=>{
  a.addEventListener("click", e=>{
    e.preventDefault();
    sections.forEach(s=>s.classList.remove("active"));
    const target = document.getElementById(a.dataset.section);
    target.classList.add("active");
  });
});
// Show Weather by default
document.getElementById("weather").classList.add("active");
</script>

</body>
</html>
